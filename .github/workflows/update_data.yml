name: Update Dashboard Data

on:
  schedule:
    - cron: '30 3 * * *'  # runs daily at 9am IST (3:30am UTC)
  workflow_dispatch:        # also allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client pandas openpyxl

      - name: Write credentials file
        run: echo '${{ secrets.GSHEET_CREDENTIALS }}' > creds.json

      - name: Run update script
        run: python scripts/update_live.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/jul_2026.csv
          git diff --staged --quiet || git commit -m "Auto-update July data $(date +%Y-%m-%d)"
          git push
